[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "common-python"
version = "0.5.2"
description = "Small, dependency-light utilities shared by personal Python services."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Vladislav Gerasimov", email = "me@vgerasimov.dev" }]
license = { text = "MIT" }
classifiers = ["Programming Language :: Python :: 3"]

[project.scripts]
columns-tui = "common_python.columns_tui:main"

[project.optional-dependencies]
config = ["PyYAML>=6"]
flask = ["Flask>=3.1"]
lua = ["lupa>=2.5"]
rich = ["rich>=13"]
textual = ["textual>=0.80", "PyYAML>=6"]

[dependency-groups]
dev = ["ruff>=0.12.0"]

[tool.hatch.build.targets.wheel]
packages = ["common_python"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
